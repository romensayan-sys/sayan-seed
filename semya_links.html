<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СЕМЯ</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:white;background:#08051a;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:380px;height:380px;border-radius:50%;filter:blur(90px);opacity:.55;z-index:-1}
body:before{background:#7c3cff;top:-120px;left:-100px}body:after{background:#00d9ff;right:-130px;bottom:-100px}
.wrap{max-width:520px;margin:auto;padding:55px 22px 40px;text-align:center}
.logo{width:105px;height:105px;margin:auto;border-radius:32px;display:grid;place-items:center;font-size:45px;background:linear-gradient(135deg,#00e5ff,#7c3cff,#ff2da1);box-shadow:0 0 35px #7c3cffaa;transform:rotate(-5deg)}
h1{margin:24px 0 6px;font-size:34px;letter-spacing:4px;text-shadow:0 0 18px #00d9ff}
.sub{opacity:.75;margin-bottom:35px;font-size:15px}
.card{display:block;text-decoration:none;color:white;margin:17px 0;padding:18px 22px;border-radius:24px;text-align:left;position:relative;overflow:hidden;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 35px #0008}
.tg{box-shadow:0 0 25px #229ed955;border-color:#229ed988}.dc{box-shadow:0 0 25px #5865f255;border-color:#5865f288}
.icon{font-size:31px;float:left;margin-right:17px}.name{font-size:20px;font-weight:800}.desc{font-size:13px;opacity:.7;margin-top:4px}
.footer{margin-top:38px;font-size:12px;opacity:.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🌱</div>
  <h1>СЕМЯ</h1>
  <div class="sub">Мои ссылки ↓</div>

  <a class="card tg" href="https://t.me/sayanseed" target="_blank">
    <span class="icon">✈️</span>
    <div class="name">TELEGRAM</div>
    <div class="desc">СЕМЯ • t.me/sayanseed</div>
  </a>

  <a class="card dc" href="https://discord.gg/dvUmjTUfZb" target="_blank">
    <span class="icon">🎮</span>
    <div class="name">DISCORD</div>
    <div class="desc">СЕМЯ • присоединиться</div>
  </a>

  <div class="footer">© СЕМЯ</div>
</div>
</body>
</html>
